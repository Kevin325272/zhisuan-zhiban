name: xuetu_mvp

services:
  postgres:
    image: postgres:17.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    env_file:
      - ${XUETU_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "3001"
      XUETU_LISTEN_HOST: "0.0.0.0"
      XUETU_ALLOW_LOCAL_DEMO_PAST_EXAMS: ${XUETU_ALLOW_LOCAL_DEMO_PAST_EXAMS:?XUETU_ALLOW_LOCAL_DEMO_PAST_EXAMS is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/v1/system-status').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - external_question_uploads:/app/.runtime/external-questions
    networks:
      - backend

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      XUETU_PUBLIC_ORIGIN: ${XUETU_PUBLIC_ORIGIN:?XUETU_PUBLIC_ORIGIN is required}
      XUETU_TLS_SERVER_NAME: ${XUETU_TLS_SERVER_NAME:?XUETU_TLS_SERVER_NAME is required}
      XUETU_TLS_ISSUER: ${XUETU_TLS_ISSUER:-internal}
    ports:
      - ${XUETU_HTTP_PORT:-80}:80
      - ${XUETU_HTTPS_PORT:-443}:443
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  external_question_uploads:
  caddy_data:
  caddy_config:
